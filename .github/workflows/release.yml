name: Build and release CPA API Adapter

on:
  push:
    branches:
      - main
      - 'feature/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Native ABI (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux_amd64
            runner: ubuntu-24.04
            arch: amd64
            library: cpa-api-adapter.so
          - platform: linux_arm64
            runner: ubuntu-24.04-arm
            arch: arm64
            library: cpa-api-adapter.so
          - platform: darwin_amd64
            runner: macos-15-intel
            arch: amd64
            library: cpa-api-adapter.dylib
          - platform: darwin_arm64
            runner: macos-15
            arch: arm64
            library: cpa-api-adapter.dylib
          - platform: windows_amd64
            runner: windows-2022
            arch: amd64
            library: cpa-api-adapter.dll
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Zig for the Linux glibc baseline
        if: runner.os == 'Linux'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - name: Install Windows C compiler
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Determine package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Release tag must have the form vX.Y.Z" >&2
              exit 1
            fi
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Run adapter integration tests
        run: go test ./internal/adapter
      - name: Build Linux library
        if: runner.os == 'Linux'
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          PLUGIN_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          export CGO_ENABLED=1 GOOS=linux GOARCH="$TARGET_ARCH"
          if [[ "$TARGET_ARCH" == amd64 ]]; then
            export GOAMD64=v1 CC='zig cc -target x86_64-linux-gnu.2.17'
          else
            export GOARM64=v8.0 CC='zig cc -target aarch64-linux-gnu.2.17'
          fi
          export CGO_CFLAGS='-mcpu=baseline'
          mkdir -p build
          go build -trimpath -buildvcs=false -buildmode=c-shared \
            -ldflags "-X=cpa-api-adapter/internal/adapter.pluginVersion=$PLUGIN_VERSION" \
            -o build/cpa-api-adapter.so ./cmd/cpa-api-adapter
      - name: Build macOS library
        if: runner.os == 'macOS'
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          PLUGIN_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          export CGO_ENABLED=1 GOOS=darwin GOARCH="$TARGET_ARCH"
          if [[ "$TARGET_ARCH" == amd64 ]]; then export GOAMD64=v1; else export GOARM64=v8.0; fi
          mkdir -p build
          go build -trimpath -buildvcs=false -buildmode=c-shared \
            -ldflags "-X=cpa-api-adapter/internal/adapter.pluginVersion=$PLUGIN_VERSION" \
            -o build/cpa-api-adapter.dylib ./cmd/cpa-api-adapter
      - name: Build Windows library
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          MSYS2_ARG_CONV_EXCL: '*'
          PLUGIN_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          export CGO_ENABLED=1 GOOS=windows GOARCH=amd64 GOAMD64=v1
          export CGO_CFLAGS='-march=x86-64' CGO_LDFLAGS='-static -static-libgcc'
          mkdir -p build
          go build -trimpath -buildvcs=false -buildmode=c-shared \
            -ldflags "-X=cpa-api-adapter/internal/adapter.pluginVersion=$PLUGIN_VERSION" \
            -o build/cpa-api-adapter.dll ./cmd/cpa-api-adapter
      - name: Verify compiled CPA ABI
        shell: bash
        env:
          PLUGIN_LIBRARY: ${{ matrix.library }}
          PLUGIN_VERSION: ${{ steps.version.outputs.version }}
        run: python scripts/smoke_plugin.py "build/$PLUGIN_LIBRARY" "$PLUGIN_VERSION"
      - name: Package plugin for CPA
        shell: bash
        env:
          PLUGIN_LIBRARY: ${{ matrix.library }}
          PLUGIN_VERSION: ${{ steps.version.outputs.version }}
          PLUGIN_PLATFORM: ${{ matrix.platform }}
        run: python scripts/package_release.py "$PLUGIN_VERSION" "$PLUGIN_PLATFORM" "build/$PLUGIN_LIBRARY"
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.platform }}
          path: dist/cpa-api-adapter_${{ steps.version.outputs.version }}_${{ matrix.platform }}.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: plugin-*
          merge-multiple: true
          path: dist
      - name: Generate and verify checksums
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          cd dist
          files=()
          for platform in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64 windows_amd64; do
            file="cpa-api-adapter_${version}_${platform}.zip"
            test -s "$file"
            files+=("$file")
          done
          test "$(find . -maxdepth 1 -type f -name '*.zip' | wc -l)" -eq 5
          sha256sum "${files[@]}" > checksums.txt
          sha256sum -c checksums.txt
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/checksums.txt \
            --verify-tag \
            --title "CPA API Adapter $GITHUB_REF_NAME" \
            --generate-notes
