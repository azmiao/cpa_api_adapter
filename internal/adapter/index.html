<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>API 适配器</title>
<style>
:root{color-scheme:light dark;--bg:#f4f6fa;--card:#fff;--text:#182235;--muted:#5c687b;--border:#dce2ea;--accent:#315dd8;--soft:#edf3ff;--good:#087a52;--bad:#b33b35;font:15px/1.55 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--bg);color:var(--text)}main{max-width:1120px;margin:auto;padding:28px 22px 60px}h1{font-size:26px;margin:0}h2{font-size:18px;margin:0}h3{font-size:15px;margin:0}header,.head,.row,.actions,.address{display:flex;align-items:center;justify-content:space-between;gap:12px}header{margin-bottom:24px}.pill{font-size:13px;border:1px solid var(--border);border-radius:24px;padding:5px 12px}.good{color:var(--good)}.bad,.danger{color:var(--bad)}button,input,select{font:inherit}button{cursor:pointer;padding:9px 14px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text)}button:hover{border-color:var(--accent)}button:disabled{opacity:.5;cursor:default}button:focus-visible,input:focus,select:focus{outline:2px solid var(--accent);outline-offset:2px}.primary{background:var(--accent);border-color:var(--accent);color:#fff}input:not([type=checkbox]),select{width:100%;display:block;margin-top:6px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text)}label{display:block;font-weight:600}.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px}.tabs{display:flex;gap:6px;border-bottom:1px solid var(--border);margin-bottom:20px;padding-bottom:10px}.tabs button{border-color:transparent;background:transparent}.tabs button[aria-selected=true]{color:var(--accent);background:var(--soft);font-weight:650}.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px}.sidebar{align-self:start;padding:14px}.sidebar .head{margin-bottom:14px}.api-list{display:grid;gap:7px}.api-item{text-align:left;width:100%;overflow-wrap:anywhere}.api-item[aria-current=true]{border-color:var(--accent);background:var(--soft)}.api-item code{display:block;font-size:12px;color:var(--muted);margin-top:3px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 18px}.full{grid-column:1/-1}.head{margin-bottom:18px}.empty{padding:36px 14px;border:1px dashed var(--border);border-radius:10px;text-align:center;color:var(--muted)}.feedback{color:var(--bad);white-space:pre-wrap;margin-top:12px;min-height:24px}.feedback.good{color:var(--good)}.actions{background:var(--card);padding:12px 16px;margin-top:18px;border:1px solid var(--border);border-radius:12px}.actions span{color:var(--muted);font-size:13px}.mapping{padding:16px;border:1px solid var(--border);border-radius:10px;margin-top:14px}.mapping .head{margin-bottom:12px}.mapping .remove{padding:5px 10px}details{margin-top:16px}summary{cursor:pointer;color:var(--accent);margin-bottom:12px}fieldset{border:0;margin:0;padding:0;min-width:0}legend{font-weight:600}.checks{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px}.checks label{font-weight:400}.catalog{max-height:320px;overflow:auto;margin:12px 0;border:1px solid var(--border);border-radius:9px}.catalog-row{display:flex;gap:12px;align-items:center;padding:12px;border-bottom:1px solid var(--border)}.catalog-row:last-child{border-bottom:0}.catalog-row div{flex:1;min-width:0;overflow-wrap:anywhere}.catalog-row code{display:block;font-size:12px;color:var(--muted)}.address{padding:14px;background:var(--soft);border:1px solid var(--border);border-radius:9px;margin-bottom:18px}.address code{overflow-wrap:anywhere;min-width:0}pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:14px;border:1px solid var(--border);border-radius:9px;background:var(--soft);font-size:12px}.key-row{display:flex;gap:8px;align-items:center;margin-top:6px}.key-row input{margin:0}.key-row button{flex:none}#login-card{max-width:600px;margin:40px auto}#login-form .primary{margin-top:18px}.count{color:var(--muted);font-size:13px}.notice{padding:12px 14px;border-left:3px solid var(--accent);background:var(--soft);border-radius:6px;margin-top:18px}
#listen-status{display:block;overflow-wrap:anywhere}#address-hint{margin:-6px 0 18px}
.field-hint{display:block;margin-top:6px;color:var(--muted);font-size:13px;font-weight:400}
.select-control{position:relative;margin-top:6px}
.select-trigger{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;padding:10px 12px;font-weight:400}
.select-trigger::after{content:"";width:7px;height:7px;flex:none;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg) translateY(-2px)}
.select-trigger[aria-expanded=true]{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)}
.select-menu{position:absolute;z-index:20;top:calc(100% + 5px);left:0;right:0;margin:0;padding:5px;list-style:none;max-height:240px;overflow:auto;border:1px solid var(--border);border-radius:11px;background:var(--card);box-shadow:0 12px 30px color-mix(in srgb,var(--text) 25%,transparent)}
.select-control.open-up .select-menu{top:auto;bottom:calc(100% + 5px)}
.select-option{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 10px;border-radius:7px;cursor:pointer;font-weight:400;outline:none}
.select-option:hover,.select-option:focus{background:var(--soft);color:var(--text)}
.select-option[aria-selected=true]{color:var(--accent);font-weight:650}
.select-option[aria-selected=true]::after{content:"";width:8px;height:5px;flex:none;border-left:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg)}
@media(max-width:720px){main{padding:20px 14px 50px}.layout,.grid{grid-template-columns:1fr}.full{grid-column:auto}.api-list{display:flex;overflow:auto}.api-item{min-width:160px}.card{padding:16px}.actions span{font-size:12px}.catalog-row{flex-wrap:wrap}.tabs{overflow:auto;white-space:nowrap}}
@media(prefers-color-scheme:dark){:root{--bg:#111827;--card:#1c2637;--text:#e8edf6;--muted:#aab6c9;--border:#38465a;--accent:#83a6ff;--soft:#23334d;--good:#75dbad;--bad:#ff9d96}.primary{background:#416bdc;border-color:#416bdc;color:#fff}}
</style>
</head>
<body><main>
<header><h1>API 适配器</h1><span id="status" class="pill">尚未连接</span></header>
<section id="login-card" class="card"><h2>连接管理中心</h2><form id="login-form"><label>CPA 管理密钥<input id="management-key" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">连接</button></form><div id="login-message" class="feedback" role="alert"></div></section>
<div id="app" hidden>
<nav class="tabs" role="tablist" aria-label="管理页签"><button id="tab-apis" role="tab" aria-selected="true" aria-controls="page-apis" data-page="apis">API</button><button id="tab-settings" role="tab" aria-selected="false" aria-controls="page-settings" data-page="settings" tabindex="-1">设置</button></nav>
<section id="page-apis" role="tabpanel" aria-labelledby="tab-apis" class="layout">
<aside class="card sidebar"><div class="head"><h2>API</h2><button id="add-api" type="button">新增</button></div><div id="api-list" class="api-list"></div></aside>
<div id="no-api" class="card empty">尚未配置 API</div>
<section id="api-editor" class="card" hidden>
<div class="head"><h2 id="api-title">API</h2><button id="remove-api" class="danger" type="button">删除 API</button></div>
<nav class="tabs" role="tablist" aria-label="API 页签"><button id="tab-config" role="tab" aria-selected="true" aria-controls="panel-config" data-panel="config">配置</button><button id="tab-models" role="tab" aria-selected="false" aria-controls="panel-models" data-panel="models" tabindex="-1">模型</button><button id="tab-access" role="tab" aria-selected="false" aria-controls="panel-access" data-panel="access" tabindex="-1">接入</button></nav>
<div id="panel-config" role="tabpanel" aria-labelledby="tab-config"><div class="grid">
<label>名称<input id="api-name" autocomplete="off"></label>
<label>出口格式<select id="api-format"><option value="v1">v1</option><option value="backend-api">backend-api</option></select></label>
<div class="full"><label>API Key<div class="key-row"><input id="api-key" type="password" autocomplete="off" aria-describedby="api-key-hint" required><button id="show-key" type="button" aria-pressed="false">显示</button></div></label><small id="api-key-hint" class="field-hint">填写 CPA 已有的客户端 API Key（非管理密钥）。在 CPA 删除后，此处配置仍保留，但该 Key 会失效。</small></div>
<label>路由前缀<input id="api-prefix" required placeholder="/work"></label>
<label>CPA 内部地址<input id="api-upstream" type="url" required placeholder="http://127.0.0.1:8317"></label>
</div></div>
<div id="panel-models" role="tabpanel" aria-labelledby="tab-models" hidden>
<div class="head"><h3>暴露模型</h3><div class="row"><button id="load-models" type="button">获取模型</button><button id="add-model" type="button">添加模型</button></div></div>
<div id="catalog-message" class="feedback" role="status"></div>
<div id="catalog-results" hidden><label>搜索模型<input id="model-filter" type="search"></label><div id="model-list" class="catalog" role="list" aria-label="上游模型"></div><div class="row"><span id="catalog-count" class="count"></span><button id="show-more" type="button" hidden>显示更多</button></div></div>
<div id="mappings"></div><div id="empty-models" class="empty">全部模型</div>
</div>
<div id="panel-access" role="tabpanel" aria-labelledby="tab-access" hidden>
<div class="address"><code id="base-url"></code><button id="copy-url" type="button">复制地址</button></div>
<div id="address-hint" class="count"></div>
<div id="unix-proxy"><label>代理软件<select id="proxy-type"><option value="nginx">Nginx</option><option value="caddy">Caddy</option></select></label>
<pre id="proxy-snippet"></pre><button id="copy-proxy" type="button">复制配置</button></div><div id="copy-message" class="feedback" role="status"></div>
</div>
</section></section>
<section id="page-settings" role="tabpanel" aria-labelledby="tab-settings" class="card" hidden><div class="head"><h2>设置</h2></div><div class="grid">
<label class="full">监听方式<select id="listen-mode"><option value="unix">Unix 套接字</option><option value="tcp">TCP</option></select></label>
<label id="tcp-settings" class="full" hidden>TCP 监听地址<input id="listen-address" autocomplete="off" placeholder="127.0.0.1:18318"></label>
<fieldset id="unix-settings" class="grid full"><label class="full">本地套接字路径<input id="socket-path" required></label><label>套接字权限<select id="socket-mode"><option value="0660">0660</option><option value="0600">0600</option><option value="0666">0666</option></select></label></fieldset>
<div class="full"><label>实际监听地址</label><code id="listen-status">未监听</code></div>
<label>最大请求体（MB）<input id="max-body" type="number" min="1" max="512" step="1" required></label>
</div><div class="notice">API Key 保存在 CPA 配置文件中；管理密钥仅保存在当前页面内存中。</div></section>
<div id="message" class="feedback" role="status" aria-live="polite"></div>
<div class="actions"><span id="save-state">已保存</span><button id="save" class="primary" type="button">保存全部</button></div>
</div>
</main>
<template id="model-template"><div class="mapping"><div class="head"><h3 class="mapping-title">模型</h3><button type="button" class="remove danger">删除</button></div><div class="grid">
<label>CPA 目标模型<input class="target" required></label><label>对外模型 ID<input class="id" required></label><label class="full">显示名称（可选）<input class="display"></label></div>
<details><summary>模型能力</summary><div class="grid"><label>上下文窗口<input class="context" type="number" min="1" step="1"></label><label>最大上下文窗口<input class="max-context" type="number" min="1" step="1"></label><label>最大输出 token<input class="max-tokens" type="number" min="1" step="1"></label><label>输入类型<select class="modalities"><option value="">沿用 CPA</option><option value="text">文本</option><option value="text,image">文本和图片</option></select></label><fieldset class="full"><legend>推理等级</legend><div class="checks"><label><input type="checkbox" value="none">none</label><label><input type="checkbox" value="minimal">minimal</label><label><input type="checkbox" value="low">low</label><label><input type="checkbox" value="medium">medium</label><label><input type="checkbox" value="high">high</label><label><input type="checkbox" value="xhigh">xhigh</label><label><input type="checkbox" value="max">max</label><label><input type="checkbox" value="ultra">ultra</label></div></fieldset><label>默认推理等级<select class="default-reasoning"><option value="">沿用所选等级</option><option>none</option><option>minimal</option><option>low</option><option>medium</option><option>high</option><option>xhigh</option><option>max</option><option>ultra</option></select></label></div></details></div></template>
<script>
'use strict';
const $ = id => document.getElementById(id);
const marker = '/v0/resource/plugins/cpa-api-adapter/';
const index = location.pathname.indexOf(marker);
const root = index < 0 ? '' : location.pathname.slice(0,index);
const management = root + '/v0/management/plugins/cpa-api-adapter/';
const configURL = root + '/v8/management/config/plugins/configs/cpa-api-adapter';
let managementKey = '', apis = [], active = -1, dirty = false, revision = 0, catalogLimit = 50;
const catalogs = new WeakMap();
const selectControllers = new WeakMap();
let openSelect = null, selectSequence = 0;
function closeSelect(restoreFocus=false){
  if(!openSelect)return;const current=openSelect;openSelect=null;current.menu.hidden=true;current.wrapper.classList.remove('open-up');current.trigger.setAttribute('aria-expanded','false');if(restoreFocus)current.trigger.focus();
}
function enhanceSelect(select){
  if(selectControllers.has(select))return;
  const wrapper=document.createElement('div');wrapper.className='select-control';
  const trigger=document.createElement('button');trigger.type='button';trigger.className='select-trigger';trigger.id='select-trigger-'+(++selectSequence);
  trigger.setAttribute('aria-label',select.getAttribute('aria-label')||select.closest('label')?.firstChild.textContent.trim()||'选择');trigger.setAttribute('aria-haspopup','listbox');trigger.setAttribute('aria-expanded','false');
  const label=document.createElement('span');trigger.append(label);
  const menu=document.createElement('ul');menu.id='select-menu-'+selectSequence;menu.className='select-menu';menu.hidden=true;menu.setAttribute('role','listbox');menu.setAttribute('aria-labelledby',trigger.id);trigger.setAttribute('aria-controls',menu.id);
  const items=[...select.options].map((option,index)=>{
    const item=document.createElement('li');item.className='select-option';item.setAttribute('role','option');item.tabIndex=-1;item.textContent=option.textContent;
    const choose=event=>{event.preventDefault();if(trigger.disabled)return;select.selectedIndex=index;sync();closeSelect(true);select.dispatchEvent(new Event('change',{bubbles:true}));};
    item.addEventListener('click',choose);
    item.addEventListener('keydown',event=>{
      let next=index;
      if(event.key==='ArrowDown')next=(index+1)%items.length;else if(event.key==='ArrowUp')next=(index+items.length-1)%items.length;else if(event.key==='Home')next=0;else if(event.key==='End')next=items.length-1;
      else if(event.key==='Enter'||event.key===' '){choose(event);return;}else if(event.key==='Escape'){event.preventDefault();closeSelect(true);return;}else if(event.key==='Tab'){closeSelect(true);return;}else return;
      event.preventDefault();items[next].focus();
    });menu.append(item);return item;
  });
  function sync(){label.textContent=select.selectedOptions[0]?.textContent||'';trigger.disabled=select.matches(':disabled');items.forEach((item,index)=>item.setAttribute('aria-selected',String(index===select.selectedIndex)));}
  const controller={wrapper,trigger,menu,sync};selectControllers.set(select,controller);
  trigger.addEventListener('click',()=>{
    if(openSelect===controller){closeSelect();return;}closeSelect();menu.hidden=false;trigger.setAttribute('aria-expanded','true');openSelect=controller;
    const box=trigger.getBoundingClientRect();if(window.innerHeight-box.bottom<menu.offsetHeight&&box.top>window.innerHeight-box.bottom)wrapper.classList.add('open-up');(items[select.selectedIndex]||items[0])?.focus();
  });
  trigger.addEventListener('keydown',event=>{if(event.key==='ArrowDown'||event.key==='ArrowUp'){event.preventDefault();trigger.click();}});
  wrapper.append(trigger,menu);select.hidden=true;select.setAttribute('aria-hidden','true');select.insertAdjacentElement('afterend',wrapper);select.addEventListener('change',sync);sync();
}
function syncSelect(select){selectControllers.get(select)?.sync();}
document.addEventListener('pointerdown',event=>{if(openSelect&&!openSelect.wrapper.contains(event.target))closeSelect();});
document.addEventListener('focusin',event=>{if(openSelect&&!openSelect.wrapper.contains(event.target))closeSelect();});
document.querySelectorAll('select').forEach(enhanceSelect);
function message(id,text,good=false){$(id).textContent=text;$(id).classList.toggle('good',good);}
function changed(){dirty=true;revision++;$('save-state').textContent='未保存';}
async function api(url,options={}){
  const headers=new Headers(options.headers||{});headers.set('Authorization','Bearer '+managementKey);
  if(options.body)headers.set('Content-Type','application/json');
  const response=await fetch(url,{...options,headers,cache:'no-store',credentials:'same-origin'});
  let data;try{data=await response.json();}catch{data={};}
  if(!response.ok)throw new Error(data.error?.message||data.error||'请求失败（HTTP '+response.status+'）');
  return data;
}
function setStatus(status){$('status').textContent=status.running?'插件已就绪':'插件未就绪';$('status').className='pill '+(status.running?'good':'bad');$('listen-status').textContent=status.running?status.listen_mode+' '+status.listen_address:'未监听';}
function selectTab(button){
  closeSelect();
  const nav=button.parentElement;
  for(const tab of nav.querySelectorAll('[role=tab]')){
    const selected=tab===button;tab.setAttribute('aria-selected',String(selected));tab.tabIndex=selected?0:-1;$(tab.getAttribute('aria-controls')).hidden=!selected;
  }
}
for(const nav of document.querySelectorAll('[role=tablist]')){
  nav.addEventListener('click',event=>{const tab=event.target.closest('[role=tab]');if(tab)selectTab(tab);});
  nav.addEventListener('keydown',event=>{
    const tabs=[...nav.querySelectorAll('[role=tab]')];let next=tabs.indexOf(document.activeElement);
    if(event.key==='ArrowRight')next=(next+1)%tabs.length;else if(event.key==='ArrowLeft')next=(next+tabs.length-1)%tabs.length;else if(event.key==='Home')next=0;else if(event.key==='End')next=tabs.length-1;else return;
    event.preventDefault();selectTab(tabs[next]);tabs[next].focus();
  });
}
function collectMappings(){return [...$('mappings').children].map(node=>{
  const value=selector=>node.querySelector(selector).value.trim();const item={id:value('.id'),target:value('.target')};
  for(const [key,selector] of [['display_name','.display'],['default_reasoning','.default-reasoning']])if(value(selector))item[key]=value(selector);
  for(const [key,selector] of [['context_window','.context'],['max_context_window','.max-context'],['max_tokens','.max-tokens']])if(value(selector))item[key]=Number(value(selector));
  if(value('.modalities'))item.input_modalities=value('.modalities').split(',');
  const levels=[...node.querySelectorAll('input[type=checkbox]:checked')].map(input=>input.value);if(levels.length)item.reasoning_levels=levels;
  return item;
});}
function storeActive(){if(active<0)return;Object.assign(apis[active],{name:$('api-name').value.trim(),api_key:$('api-key').value.trim(),prefix:$('api-prefix').value.trim(),upstream:$('api-upstream').value.trim().replace(/\/$/,''),format:$('api-format').value,mappings:collectMappings()});}
function collect(){storeActive();return {listen_mode:$('listen-mode').value,listen_address:$('listen-address').value.trim(),socket_path:$('socket-path').value.trim(),socket_mode:$('socket-mode').value,max_body_mb:Number($('max-body').value),apis:structuredClone(apis)};}
function renderAPIs(){
  $('api-list').replaceChildren();apis.forEach((item,i)=>{
    const button=document.createElement('button');button.type='button';button.className='api-item';button.setAttribute('aria-current',String(i===active));
    const name=document.createElement('span');name.textContent=item.name||'API '+(i+1);const path=document.createElement('code');path.textContent=item.prefix?item.prefix+'/'+item.format:'未设置前缀';button.append(name,path);
    button.addEventListener('click',()=>{storeActive();showAPI(i);});$('api-list').append(button);
  });
  $('api-title').textContent=active<0?'API':apis[active].name||'API '+(active+1);
}
function showAPI(i){
  closeSelect();active=i;$('no-api').hidden=i>=0;$('api-editor').hidden=i<0;renderAPIs();if(i<0)return;
  const item=apis[i];for(const [id,key] of [['api-name','name'],['api-key','api_key'],['api-prefix','prefix'],['api-upstream','upstream'],['api-format','format']])$(id).value=item[key]||'';syncSelect($('api-format'));
  $('api-key').type='password';$('show-key').textContent='显示';$('show-key').setAttribute('aria-pressed','false');
  $('mappings').replaceChildren();for(const model of item.mappings||[])addMapping(model);
  $('model-filter').value='';catalogLimit=50;message('catalog-message','');message('copy-message','');updateMappings();address();
}
function addMapping(model={}){
  const node=$('model-template').content.firstElementChild.cloneNode(true);
  for(const [selector,key] of [['.id','id'],['.target','target'],['.display','display_name'],['.context','context_window'],['.max-context','max_context_window'],['.max-tokens','max_tokens'],['.default-reasoning','default_reasoning']])node.querySelector(selector).value=model[key]||'';
  node.querySelector('.modalities').value=(model.input_modalities||[]).join(',');for(const input of node.querySelectorAll('input[type=checkbox]'))input.checked=(model.reasoning_levels||[]).includes(input.value);
  node.querySelector('.remove').addEventListener('click',()=>{if(openSelect&&node.contains(openSelect.wrapper))closeSelect();node.remove();storeActive();changed();updateMappings();});$('mappings').append(node);node.querySelectorAll('select').forEach(enhanceSelect);updateMappings();return node;
}
function updateMappings(){[...$('mappings').children].forEach((node,i)=>node.querySelector('.mapping-title').textContent='模型 '+(i+1));$('empty-models').hidden=$('mappings').children.length>0;renderCatalog();}
function fingerprint(item){return JSON.stringify([item.api_key,item.upstream,item.format]);}
function renderCatalog(){
  const entry=active<0?null:catalogs.get(apis[active]);const valid=entry&&entry.fingerprint===fingerprint(apis[active]);$('catalog-results').hidden=!valid;if(!valid)return;
  const query=$('model-filter').value.trim().toLocaleLowerCase();const filtered=entry.models.filter(model=>(model.id+' '+model.name).toLocaleLowerCase().includes(query));
  const counts=new Map();for(const model of entry.models)counts.set(model.id,(counts.get(model.id)||0)+1);
  const existing=new Set(collectMappings().map(model=>model.id));$('model-list').replaceChildren();
  for(const model of filtered.slice(0,catalogLimit)){
    const row=document.createElement('div');row.className='catalog-row';row.setAttribute('role','listitem');const info=document.createElement('div');const name=document.createElement('strong');name.textContent=model.name||model.id;const id=document.createElement('code');id.textContent=model.id;info.append(name,id);
    const button=document.createElement('button');button.type='button';button.textContent=counts.get(model.id)>1?'ID 重复':existing.has(model.id)?'已添加':'添加';button.disabled=counts.get(model.id)>1||existing.has(model.id);
    button.addEventListener('click',()=>{addMapping({id:model.id,target:model.id});storeActive();changed();});row.append(info,button);$('model-list').append(row);
  }
  if(!filtered.length)$('model-list').textContent='没有匹配的模型';$('catalog-count').textContent=filtered.length+' / '+entry.models.length+' 个模型';$('show-more').hidden=filtered.length<=catalogLimit;
}
function listenerOrigin(value){
  const match=value.trim().match(/^(\[[0-9a-fA-F:.]+\]|[a-zA-Z0-9][a-zA-Z0-9.-]*):([0-9]+)$/);
  if(!match||Number(match[2])<1||Number(match[2])>65535)return '';
  try{const url=new URL('http://'+value.trim());if(['0.0.0.0','[::]','[::ffff:0:0]'].includes(url.hostname))url.hostname=location.hostname;return url.origin;}catch{return '';}
}
function syncListenerSettings(){
  const tcp=$('listen-mode').value==='tcp';$('tcp-settings').hidden=!tcp;$('listen-address').disabled=!tcp;$('listen-address').required=tcp;$('unix-settings').hidden=tcp;$('unix-settings').disabled=tcp;$('unix-proxy').hidden=tcp;syncSelect($('socket-mode'));
}
function address(){
  if(active<0)return;const item=apis[active],base=item.prefix?item.prefix+'/'+item.format:'',tcp=$('listen-mode').value==='tcp',origin=tcp?listenerOrigin($('listen-address').value):location.origin,baseURL=origin?origin+base:'';
  $('base-url').textContent=base?(baseURL||'请填写有效的 TCP 监听地址'):'请填写路由前缀';$('copy-url').disabled=!base||!baseURL;$('copy-proxy').disabled=true;
  $('address-hint').textContent=tcp?(/^(?:0\.0\.0\.0|\[::\]|\[::ffff:(?:0:0|0\.0\.0\.0)\]):/i.test($('listen-address').value.trim())?'监听通配地址，预览使用管理页面主机名；请确认客户端可达此主机和端口。':'直连 HTTP 地址；反代、HTTPS 或端口映射请在客户端使用实际入口。'):'地址按管理页面 Origin 生成；完成本机反代后可用，其他入口请在客户端配置。';
  if(tcp){$('proxy-snippet').textContent='';return;}
  const socket=$('socket-path').value.trim().replace(/\\/g,'/');
  if(!base||!/^\/(?:[\p{L}\p{N}_~.!$&'()+,;=:@-]+\/)*[\p{L}\p{N}_~.!$&'()+,;=:@-]+$/u.test(item.prefix)||/[\s;{}$#"'\\]/.test(base)){$('proxy-snippet').textContent='请填写可用于代理配置的路由前缀';return;}
  let upstream;
  if($('proxy-type').value==='caddy'&&!/[\r\n{}]/.test(socket))upstream='unix/'+socket;
  else if(!socket.startsWith('/')||/[\s:;{}$#"'\\]/.test(socket)){$('proxy-snippet').textContent='此套接字路径不适用于 Nginx 配置，请选择 Caddy';return;}
  else upstream='unix:'+socket+':'+base+'/';
  if($('proxy-type').value==='caddy'){
    const matcher='adapter_'+(active+1);$('proxy-snippet').textContent='@'+matcher+' path '+base+'/*\nhandle @'+matcher+' {\n    reverse_proxy '+JSON.stringify(upstream)+'\n}';
  }else $('proxy-snippet').textContent='map $http_upgrade $adapter_connection_upgrade {\n    default upgrade;\n    \'\' close;\n}\n\nlocation ^~ '+base+'/ {\n    client_max_body_size '+Number($('max-body').value)+'m;\n    proxy_pass http://'+upstream+';\n    proxy_http_version 1.1;\n    proxy_set_header Host $host;\n    proxy_set_header Upgrade $http_upgrade;\n    proxy_set_header Connection $adapter_connection_upgrade;\n    proxy_buffering off;\n    proxy_cache off;\n    proxy_request_buffering off;\n    proxy_read_timeout 3600s;\n    proxy_send_timeout 3600s;\n}';
  $('copy-proxy').disabled=false;
}
function populate(cfg){$('listen-mode').value=cfg.listen_mode||'unix';$('listen-address').value=cfg.listen_address||'127.0.0.1:18318';$('socket-path').value=cfg.socket_path;$('socket-mode').value=cfg.socket_mode;$('max-body').value=cfg.max_body_mb;apis=structuredClone(cfg.apis||[]);$('proxy-type').value=$('listen-mode').value==='unix'&&/^[A-Za-z]:[\\/]/.test(cfg.socket_path)?'caddy':'nginx';for(const id of ['listen-mode','socket-mode','proxy-type'])syncSelect($(id));syncListenerSettings();showAPI(apis.length?0:-1);dirty=false;$('save-state').textContent='已保存';}
$('login-form').addEventListener('submit',async event=>{event.preventDefault();managementKey=$('management-key').value;message('login-message','');try{const status=await api(management+'status');$('management-key').value='';populate(status.config);setStatus(status);$('login-card').hidden=true;$('app').hidden=false;if(status.error)message('message',status.error);}catch(error){managementKey='';message('login-message',error.message);}});
$('add-api').addEventListener('click',()=>{storeActive();apis.push({name:'',api_key:'',prefix:'',upstream:'http://127.0.0.1:8317',format:'v1',mappings:[]});showAPI(apis.length-1);selectTab($('tab-config'));changed();$('api-name').focus();});
$('remove-api').addEventListener('click',()=>{if(!confirm('删除当前 API？保存后生效。'))return;apis.splice(active,1);showAPI(apis.length?Math.min(active,apis.length-1):-1);changed();});
$('show-key').addEventListener('click',()=>{const shown=$('api-key').type==='password';$('api-key').type=shown?'text':'password';$('show-key').textContent=shown?'隐藏':'显示';$('show-key').setAttribute('aria-pressed',String(shown));});
$('add-model').addEventListener('click',()=>{addMapping();storeActive();changed();});
$('app').addEventListener('input',event=>{if(event.target.id==='model-filter'||event.target.tagName==='SELECT')return;if(event.target.id==='listen-address')syncListenerSettings();storeActive();changed();renderAPIs();renderCatalog();address();});
$('app').addEventListener('change',event=>{if(event.target.tagName==='SELECT'){if(event.target.id==='listen-mode')syncListenerSettings();if(event.target.id==='proxy-type'){address();return;}storeActive();changed();renderAPIs();renderCatalog();address();}});
$('model-filter').addEventListener('input',()=>{catalogLimit=50;renderCatalog();});$('show-more').addEventListener('click',()=>{catalogLimit+=50;renderCatalog();});
$('load-models').addEventListener('click',async()=>{
  storeActive();const item=apis[active],request=structuredClone(item),source=fingerprint(item),button=$('load-models');button.disabled=true;message('catalog-message','正在获取模型…',true);
  try{const result=await api(management+'catalog',{method:'POST',body:JSON.stringify(request)});if(apis[active]!==item||fingerprint(item)!==source)return;if(!Array.isArray(result.models))throw new Error('模型目录格式无效');catalogs.set(item,{fingerprint:source,models:result.models});catalogLimit=50;renderCatalog();message('catalog-message',(result.warnings||[]).join('；'),!(result.warnings||[]).length);}catch(error){if(apis[active]===item){catalogs.delete(item);renderCatalog();message('catalog-message',error.message);}}finally{button.disabled=false;}
});
async function copyElement(id){
  const text=$(id).textContent;let copied=false;
  try{await navigator.clipboard.writeText(text);copied=true;}catch{
    const previous=document.activeElement,field=document.createElement('textarea');field.value=text;field.style.position='fixed';field.style.left='-9999px';document.body.append(field);
    try{field.focus();field.select();copied=document.execCommand('copy');}catch{}finally{field.remove();previous?.focus();}
  }
  if(!copied){const range=document.createRange();range.selectNodeContents($(id));const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);}
  message('copy-message',copied?'已复制':'内容已选中，请手动复制',copied);
}
$('copy-url').addEventListener('click',()=>copyElement('base-url'));$('copy-proxy').addEventListener('click',()=>copyElement('proxy-snippet'));
function normalize(cfg){return {listen_mode:cfg.listen_mode||'unix',listen_address:cfg.listen_address||'127.0.0.1:18318',socket_path:cfg.socket_path,socket_mode:cfg.socket_mode,max_body_mb:cfg.max_body_mb,apis:(cfg.apis||[]).map(item=>({name:item.name||'',api_key:item.api_key,upstream:item.upstream,prefix:item.prefix,format:item.format,mappings:(item.mappings||[]).map(model=>({id:model.id,target:model.target,display_name:model.display_name||'',context_window:model.context_window||0,max_context_window:model.max_context_window||0,max_tokens:model.max_tokens||0,input_modalities:model.input_modalities||[],reasoning_levels:model.reasoning_levels||[],default_reasoning:model.default_reasoning||''}))}))};}
$('save').addEventListener('click',async()=>{
  const button=$('save');button.disabled=true;message('message','正在保存…',true);
  try{
    const cfg=collect(),savedRevision=revision;await api(management+'validate',{method:'POST',body:JSON.stringify(cfg)});await api(configURL,{method:'PATCH',body:JSON.stringify(cfg)});
    let last,confirmed=false;for(let i=0;i<12;i++){await new Promise(resolve=>setTimeout(resolve,500));try{last=await api(management+'status');setStatus(last);if(JSON.stringify(normalize(last.config))===JSON.stringify(normalize(cfg))){confirmed=true;break;}}catch{}}
    if(!confirmed)throw new Error('配置已写入，尚未确认插件重新加载，请检查 CPA 日志');
    if(revision===savedRevision){dirty=false;$('save-state').textContent=last.running?'已保存':'已保存，未启动';}
    if(!last.running)throw new Error('配置已写入，但插件未启动：'+(last.error||'请检查监听地址或套接字路径'));
    message('message',dirty?'配置已保存；当前页面仍有未保存修改':'配置已保存',true);
  }catch(error){message('message',error.message);}finally{button.disabled=false;}
});
window.addEventListener('beforeunload',event=>{if(dirty){event.preventDefault();event.returnValue='';}});
</script>
